    <h1>Eyes of the Eternal</h1>

    <div class="poem">

Symphony of love,
being paraded in your eyes,
Deluding in such a way,
being enmeshed with ties;

Royal vague of obsession,
leading the cognitive desonance,
Shower some mercy on me,
reviving my eternal resonance.
